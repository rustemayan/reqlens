[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reqlens"
version = "1.0.0"
description = "ИИ-агент статической проверки требований по ISO/IEC/IEEE 29148 и IEEE 830"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pypdf>=4.0", "markdown>=3.5", "certifi>=2023.7.22"]

[project.scripts]
reqlens = "reqlens.cli:main"

[tool.setuptools.packages.find]
include = ["reqlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
